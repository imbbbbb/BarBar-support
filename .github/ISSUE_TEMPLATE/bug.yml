name: 报告问题
description: BarBar 哪里不对劲
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 出了什么问题
      description: 说说你做了什么、期望发生什么、实际发生了什么。
      placeholder: |
        例：点箭头展开后，Surge 的图标显示成一个空白方块。
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: 涉及哪个 app 的图标
      description: 如果问题只出在某些图标上，写出是哪些。
      placeholder: Surge、Googly Eyes

  - type: dropdown
    id: style
    attributes:
      label: 展开形态
      options:
        - 原地展开
        - 下方面板
        - 两种都有问题
        - 和展开无关

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "26.1"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BarBar 版本
      description: 在设置窗口里能看到。
      placeholder: "0.1"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充
      description: 菜单栏的截图往往比文字管用。
