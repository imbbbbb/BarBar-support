name: 功能建议
description: 你希望 BarBar 还能做什么
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 你想解决的问题
      description: 先说你实际遇到的场景，而不是直接说要加什么按钮 —— 场景清楚了，
        往往有更好的做法。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      description: 可选。
